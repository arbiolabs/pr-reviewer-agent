[package]
name = "pr-review-tui"
version = "1.9.0"
edition = "2024"
publish = false

[[bin]]
name = "pr-review-tui"
path = "src/main.rs"

[dependencies]
crossterm = "=0.29.0"
libc = "=0.2.191"
ratatui = "=0.30.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[dev-dependencies]
insta = "=1.49.0"

[profile.test]
opt-level = 1
