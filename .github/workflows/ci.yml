name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Smoke-test setup --check
        run: |
          node bin/pr-review.mjs setup --check --json > checks.json || true
          cat checks.json
          jq -e '
            (.checks | map({key: .id, value: .}) | from_entries) as $c
            | $c.git.status == "ok"
              and $c.config.status == "ok"
              and $c.model.status == "missing"
              and $c.model.detail == "no models available"
          ' checks.json

  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Smoke-test the snapshot harness
        run: |
          ./snap.sh "$RUNNER_TEMP/snaps" findings
          file "$RUNNER_TEMP/snaps/findings.png" | grep -Eq '(1280 x 800|2560 x 1600)'
