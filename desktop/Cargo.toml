[package]
name = "pr-review-desktop"
version = "1.5.0"
edition = "2024"
publish = false

[[bin]]
name = "pr-review-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.8.0"
pr-review-tui = { path = "../tui" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry", "NSString"] }
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGDataProvider", "CGImage", "CGWindow"] }
png = "=0.18.1"
